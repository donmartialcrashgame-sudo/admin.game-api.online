<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Game API — Activity Logs</title><style>body{margin:0;background:#050811;color:#fff;font:14px system-ui}.side{position:fixed;width:245px;height:100%;background:#0b101a;padding:24px 15px}.brand{font-weight:800;padding:15px}.nav{display:block;color:#8794a8;text-decoration:none;padding:13px;border-radius:9px}.nav:hover,.active{background:#172131;color:#fff}.out{position:absolute;bottom:25px;left:28px;background:none;border:0;color:#8794a8;cursor:pointer}.main{margin-left:245px;padding:42px}.pill{float:right;color:#aab5c5}.dot{color:#20c997}.panel{margin-top:30px;background:#0d141f;border:1px solid #ffffff10;border-radius:15px;padding:25px}.muted{color:#68758a}@media(max-width:700px){.side{width:68px}.brand{font-size:0}.nav{font-size:0}.main{margin-left:68px;padding:25px}}</style></head><body><aside class="side"><div class="brand">GAME API<br><small>ADMIN</small></div><a class="nav" href="dashboard.html">◈ Overview</a><a class="nav" href="users.html">♙ Users</a><a class="nav" href="games.html">◉ Games</a><a class="nav" href="api.html">⌁ API & Keys</a><a class="nav" href="transactions.html">₦ Transactions</a><a class="nav active" href="logs.html">▤ Activity Logs</a><a class="nav" href="notification.html">◫ Notifications</a><a class="nav" href="settings.html">⚙ Settings</a><button id="out" class="out">↪ Sign out</button></aside><main class="main"><span class="pill"><span class="dot">●</span> <span id="email">Administrator</span></span><small>ADMIN CONSOLE</small><h1>Activity Logs</h1><section class="panel"><h3>System Activity</h3><p class="muted">Activity monitoring will load from Supabase when the logging table is available.</p><p id="live" class="muted">Connecting to live WebSocket…</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>(async function(){var c=window.GAME_API_CONFIG||{};if(!c.SUPABASE_URL||!c.SUPABASE_ANON_KEY){location.href='index.html';return}var client=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);var r=await client.auth.getSession();if(!r.data.session){location.href='index.html';return}var a=await client.from('admin_users').select('user_id').eq('user_id',r.data.session.user.id).eq('role','admin').maybeSingle();if(a.error||!a.data){await client.auth.signOut();location.href='index.html';return}document.getElementById('email').textContent=r.data.session.user.email||'Administrator';document.getElementById('out').onclick=async function(){await client.auth.signOut();location.href='index.html'};client.channel('admin-logs-live').on('postgres_changes',{event:'*',schema:'public'},function(){document.getElementById('live').textContent='Live WebSocket connected • '+new Date().toLocaleTimeString()}).subscribe(function(status){document.getElementById('live').textContent=status==='SUBSCRIBED'?'Live WebSocket connected':'Live WebSocket status: '+status})})();</script></body></html>
