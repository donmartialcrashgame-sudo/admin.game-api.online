<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#050811"><title>Game API — Admin Dashboard</title><link rel="icon" href="https://game-api.online/favicon.ico"><style>*{box-sizing:border-box}body{margin:0;background:#050811;color:#f8fafc;font-family:Inter,system-ui,Arial,sans-serif}.sidebar{position:fixed;inset:0 auto 0 0;width:245px;background:#0b101a;border-right:1px solid #ffffff10;padding:24px 15px;display:flex;flex-direction:column}.sidebar-brand{display:flex;align-items:center;gap:11px;padding:0 10px 28px}.brand-mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#4f8cff,#7c3aed);font-weight:900}.sidebar-brand strong,.sidebar-brand small{display:block}.sidebar-brand strong{font-size:13px}.sidebar-brand small{font-size:8px;color:#6f7c90;letter-spacing:.15em;margin-top:3px}.sidebar nav{display:grid;gap:5px}.nav-item,.logout{border:0;background:none;color:#8794a8;text-align:left;padding:12px 13px;border-radius:9px;cursor:pointer;display:flex;gap:12px;align-items:center;font-weight:650}.nav-item:hover,.nav-item.active{background:#172131;color:#fff}.logout{margin-top:auto}.main{margin-left:245px;min-height:100vh;padding:34px 42px}.topbar{display:flex;align-items:end;justify-content:space-between;margin-bottom:30px}.eyebrow{font-size:10px;letter-spacing:.16em;color:#7f8ca1;font-weight:800}.topbar h2{margin:7px 0 0;font-size:29px}.admin-pill{border:1px solid #ffffff12;background:#0d141f;border-radius:99px;padding:9px 13px;color:#aab5c5;font-size:11px;display:flex;gap:8px;align-items:center}.status-dot{width:7px;height:7px;border-radius:50%;background:#20c997;box-shadow:0 0 12px #20c997}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#0d141f;border:1px solid #ffffff0e;border-radius:15px;padding:20px}.stat-label{font-size:10px;color:#7e8b9f;letter-spacing:.07em}.stat-value{font-size:27px;font-weight:850;margin-top:8px}.stat-note{font-size:10px;color:#637084;margin-top:5px}.section{margin-top:22px}.section h3{font-size:16px}.empty{padding:34px;text-align:center;color:#68758a;background:#0d141f;border:1px dashed #263247;border-radius:15px;font-size:12px}@media(max-width:800px){.sidebar{width:68px;padding:18px 8px}.sidebar-brand div:not(.brand-mark),.nav-item span,.logout span{display:none}.main{margin-left:68px;padding:24px 18px}.grid{grid-template-columns:1fr 1fr}.topbar{align-items:start;gap:15px;flex-direction:column}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><section id="dashboard"><aside class="sidebar"><div class="sidebar-brand"><div class="brand-mark">G</div><div><strong>GAME API</strong><small>ADMIN</small></div></div><nav><button class="nav-item active" data-page="overview">◈ <span>Overview</span></button><button class="nav-item" data-page="users">♙ <span>Users</span></button><button class="nav-item" data-page="games">◉ <span>Games</span></button><button class="nav-item" data-page="api">⌁ <span>API & Keys</span></button><button class="nav-item" data-page="transactions">₦ <span>Transactions</span></button><button class="nav-item" data-page="logs">▤ <span>Activity Logs</span></button><button class="nav-item" data-page="settings">⚙ <span>Settings</span></button></nav><button id="logoutBtn" class="logout">↪ <span>Sign out</span></button></aside><main class="main"><header class="topbar"><div><span class="eyebrow">ADMIN CONSOLE</span><h2 id="pageTitle">Overview</h2></div><div class="admin-pill"><span class="status-dot"></span><span id="adminEmail">Administrator</span></div></header><div id="pageContent"></div></main></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const cfg=window.GAME_API_CONFIG||{};let supabaseClient=null;const $=id=>document.getElementById(id);async function init(){if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY||cfg.SUPABASE_URL.includes('PASTE_'))return location.replace('index.html');supabaseClient=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const{data}=await supabaseClient.auth.getSession();if(!data.session)return location.replace('index.html');const{data:admin,error}=await supabaseClient.from('admin_users').select('user_id,role').eq('user_id',data.session.user.id).eq('role','admin').maybeSingle();if(error||!admin){await supabaseClient.auth.signOut();return location.replace('index.html')}$('adminEmail').textContent=data.session.user.email||'Administrator';render('overview');supabaseClient.auth.onAuthStateChange((e,s)=>{if(!s)location.replace('index.html')})}$('logoutBtn').onclick=async()=>{await supabaseClient.auth.signOut();location.replace('index.html')};document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.page)});function render(page){const t={overview:'Overview',users:'Users',games:'Games',api:'API & Keys',transactions:'Transactions',logs:'Activity Logs',settings:'Settings'};$('pageTitle').textContent=t[page]||'Overview';const p={overview:`<div class="grid"><div class="card"><div class="stat-label">TOTAL USERS</div><div class="stat-value">—</div><div class="stat-note">Customer accounts</div></div><div class="card"><div class="stat-label">ACTIVE GAMES</div><div class="stat-value">—</div><div class="stat-note">Crash & Big Odd rounds</div></div><div class="card"><div class="stat-label">API KEYS</div><div class="stat-value">—</div><div class="stat-note">Issued API credentials</div></div><div class="card"><div class="stat-label">SYSTEM</div><div class="stat-value">Online</div><div class="stat-note">Supabase connected</div></div></div><div class="section"><h3>Administration</h3><div class="empty">You are authenticated as an administrator. We will build the remaining sections one at a time.</div></div>`,users:'<div class="empty">Users module — separate page coming next.</div>',games:'<div class="empty">Games module — separate page coming next.</div>',api:'<div class="empty">API & Keys module — separate page coming next.</div>',transactions:'<div class="empty">Transactions module — separate page coming next.</div>',logs:'<div class="empty">Activity Logs module — separate page coming next.</div>',settings:'<div class="empty">Settings module — separate page coming next.</div>'};$('pageContent').innerHTML=p[page]||p.overview}init();</script></body></html>
