<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Game API — Users</title><style>body{margin:0;background:#050811;color:#f8fafc;font:14px Inter,system-ui,Arial}.side{position:fixed;width:235px;top:0;bottom:0;background:#0b101a;border-right:1px solid #ffffff10;padding:24px 15px}.brand{display:flex;gap:10px;align-items:center;margin:0 10px 25px}.mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#4f8cff,#7c3aed);font-weight:900}.brand small{display:block;color:#718096;font-size:8px;letter-spacing:.15em}.nav a,.logout{display:flex;gap:12px;color:#8794a8;text-decoration:none;padding:12px;border-radius:9px;margin:4px 0;background:none;border:0;width:100%;text-align:left;cursor:pointer}.nav a:hover,.nav .on{background:#172131;color:white}.logout{position:absolute;bottom:20px}.logout:disabled{opacity:.6;cursor:wait}.main{margin-left:235px;padding:34px 42px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}.ey{font-size:10px;letter-spacing:.16em;color:#7f8ca1}.top h1{margin:7px 0 0}.pill{background:#0d141f;border:1px solid #ffffff12;border-radius:20px;padding:9px 12px;color:#aab5c5;font-size:11px}.dot{display:inline-block;width:7px;height:7px;background:#20c997;border-radius:50%;margin-right:7px}.panel{background:#0d141f;border:1px solid #ffffff0e;border-radius:15px;overflow:hidden}.head{padding:20px;border-bottom:1px solid #ffffff0b;display:flex;justify-content:space-between;gap:15px;align-items:center}.head h3{margin:0}.meta{color:#637084;font-size:10px;margin-top:5px}.search{background:#050811;border:1px solid #ffffff12;color:white;padding:10px;border-radius:9px;outline:none}.wrap{overflow:auto}table{width:100%;min-width:900px;border-collapse:collapse}th,td{padding:14px 18px;border-bottom:1px solid #ffffff08;text-align:left;font-size:11px}th{font-size:9px;color:#718096}.badge{color:#54ddb3;background:#20c99716;border-radius:99px;padding:5px 8px}.action{color:#76a4ff;text-decoration:none}.load{text-align:center;color:#68758a;padding:35px}.error{color:#ff8f8f;background:#ff4d4d0d;border:1px solid #ff4d4d20;border-radius:10px;padding:14px;margin:15px 20px;font-size:11px;white-space:pre-wrap}@media(max-width:700px){.side{width:55px;padding:18px 7px}.brand div:last-child,.nav span,.logout span{display:none}.main{margin-left:55px;padding:20px 14px}.top{display:block}.pill{display:inline-block;margin-top:15px}}</style></head><body><aside class="side"><div class="brand"><div class="mark">G</div><div><b>GAME API</b><small>ADMIN</small></div></div><nav class="nav"><a href="dashboard.html">◈ <span>Overview</span></a><a class="on" href="users.html">♙ <span>Users</span></a><a href="games.html">◉ <span>Games</span></a><a href="api.html">⌁ <span>API & Keys</span></a><a href="transactions.html">₦ <span>Transactions</span></a><a href="logs.html">▤ <span>Activity Logs</span></a><a href="notification.html">◫ <span>Notifications</span></a><a href="settings.html">⚙ <span>Settings</span></a></nav><button class="logout" id="logout" type="button">↪ <span>Sign out</span></button></aside><main class="main"><div class="top"><div><div class="ey">ADMIN CONSOLE</div><h1>Users</h1></div><div class="pill"><i class="dot"></i><span id="email">Administrator</span></div></div><section class="panel"><div class="head"><div><h3>All Auth Users</h3><div id="meta" class="meta">Connecting to Supabase…</div></div><input id="q" class="search" placeholder="Search email, ID or phone"></div><div id="err"></div><div class="wrap"><table><thead><tr><th>USER ID</th><th>EMAIL</th><th>PHONE</th><th>STATUS</th><th>CREATED</th><th>LAST SIGN IN</th><th>ACTION</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="load">Connecting to Supabase…</td></tr></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>var users=[];function el(x){return document.getElementById(x)}function esc(v){var d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML}function date(v){return v?new Date(v).toLocaleString():'—'}function render(list){el('rows').innerHTML=list.length?list.map(function(u){var id=String(u.id||''),status=u.banned_until?'Banned':(u.email_confirmed_at?'Active':'Unconfirmed');return '<tr><td title="'+esc(id)+'">'+esc(id.slice(0,12))+'…</td><td>'+esc(u.email||'—')+'</td><td>'+esc(u.phone||'—')+'</td><td><span class="badge">'+status+'</span></td><td>'+date(u.created_at)+'</td><td>'+date(u.last_sign_in_at)+'</td><td><a class="action" href="user-details.html?id='+encodeURIComponent(id)+'">View / Manage</a></td></tr>'}).join(''):'<tr><td colspan="7" class="load">No Auth users found.</td></tr>'}async function loadUsers(){el('meta').textContent='Loading from Supabase Authentication…';var r=await db.rpc('admin_list_auth_users');if(r.error){el('meta').textContent='Unable to load users';el('rows').innerHTML='<tr><td colspan="7" class="load">Unable to load Auth users.</td></tr>';el('err').innerHTML='<div class="error">'+esc(r.error.message)+'</div>';return false}users=Array.isArray(r.data)?r.data:[];el('meta').textContent=users.length+' authenticated user'+(users.length===1?'':'s')+' found';el('err').innerHTML='';render(users);return true}async function start(){var session=await requireAdmin();if(!session)return;el('email').textContent=session.user.email||'Administrator';el('logout').addEventListener('click',async function(){this.disabled=true;this.querySelector('span').textContent='Signing out…';await signOutAdmin()});el('q').addEventListener('input',function(){var q=this.value.toLowerCase().trim();render(users.filter(function(u){return !q||JSON.stringify(u).toLowerCase().indexOf(q)!==-1}))});await loadUsers();setInterval(loadUsers,30000)}start().catch(function(e){el('err').innerHTML='<div class="error">'+esc(e.message||e)+'</div>'});</script></body></html>
