<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Game API — Users</title><style>*{box-sizing:border-box}body{margin:0;background:#050811;color:#f8fafc;font:14px Inter,system-ui,Arial}.side{position:fixed;z-index:5;width:245px;top:0;bottom:0;background:#0b101a;border-right:1px solid #ffffff0d;padding:24px 15px}.brand{display:flex;gap:11px;align-items:center;padding:0 10px 28px}.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#4f8cff,#7c3aed);font-weight:900}.brand small{display:block;color:#718096;font-size:8px;letter-spacing:.18em}.nav{display:grid;gap:4px}.nav a,.logout{display:flex;gap:12px;align-items:center;color:#8794a8;text-decoration:none;border:0;background:none;width:100%;padding:12px;border-radius:10px;cursor:pointer;font-weight:650}.nav a:hover,.nav .on{background:#172131;color:#fff}.logout{position:absolute;bottom:20px}.main{margin-left:245px;padding:34px 42px;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.ey{font-size:10px;letter-spacing:.18em;color:#718096;font-weight:800}.top h1{margin:7px 0 0;font-size:30px}.sub{color:#718096;font-size:11px;margin-top:6px}.pill{background:#0d141f;border:1px solid #ffffff12;border-radius:20px;padding:9px 12px;color:#aab5c5;font-size:11px}.dot{display:inline-block;width:7px;height:7px;background:#20c997;border-radius:50%;margin-right:7px}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:16px}.search{flex:1;max-width:480px;background:#0d141f;border:1px solid #ffffff12;color:#fff;padding:12px 14px;border-radius:10px;outline:none}.count{color:#718096;font-size:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#0d141f;border:1px solid #ffffff0c;border-radius:15px;padding:17px;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#4f8cff44}.person{display:flex;gap:12px;align-items:center}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,#4f8cff,#7c3aed);font-weight:850;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-weight:750;word-break:break-all}.uid{color:#56647a;font-size:9px;margin-top:3px}.details{margin:15px 0;border-top:1px solid #ffffff08}.line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #ffffff08}.label{font-size:9px;color:#718096}.val{font-size:10px;text-align:right;word-break:break-all}.badge{padding:5px 8px;border-radius:99px;background:#20c99716;color:#54ddb3}.foot{display:flex;justify-content:space-between;align-items:center}.view{color:#76a4ff;text-decoration:none;font-size:10px}.muted{font-size:9px;color:#5d6a7d}.error{padding:13px;border-radius:10px;background:#ff647812;border:1px solid #ff647824;color:#ff9daa;font-size:10px;margin-bottom:16px}.load{text-align:center;color:#68758a;padding:50px}.empty{grid-column:1/-1;text-align:center;padding:60px;color:#68758a;background:#0d141f;border:1px solid #ffffff0c;border-radius:15px}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:750px){.side{width:58px;padding:18px 7px}.brand div:last-child,.nav span,.logout span{display:none}.main{margin-left:58px;padding:22px 14px}.grid{grid-template-columns:1fr}.top{display:block}.pill{display:inline-block;margin-top:14px}.toolbar{display:block}.search{max-width:none;width:100%}.count{display:block;margin-top:9px}}</style></head><body><aside class="side"><div class="brand"><div class="mark">G</div><div><b>GAME API</b><small>ADMIN CONSOLE</small></div></div><nav class="nav"><a href="dashboard.html">◈ <span>Overview</span></a><a class="on" href="users.html">♙ <span>Users</span></a><a href="games.html">◉ <span>Games</span></a><a href="api.html">⌁ <span>API & Keys</span></a><a href="transactions.html">₦ <span>Transactions</span></a><a href="logs.html">▤ <span>Activity Logs</span></a><a href="notification.html">◫ <span>Notifications</span></a><a href="settings.html">⚙ <span>Settings</span></a></nav><button class="logout" id="logout" type="button">↪ <span>Sign out</span></button></aside><main class="main"><header class="top"><div><div class="ey">ADMIN CONSOLE / ACCOUNTS</div><h1>Users</h1><div class="sub">Manage every account registered through Supabase Authentication.</div></div><div class="pill"><i class="dot"></i><span id="email">Administrator</span></div></header><div class="toolbar"><input id="q" class="search" placeholder="Search email, user ID or phone…"><span id="meta" class="count">Loading Auth users…</span></div><div id="err"></div><section id="grid" class="grid"><div class="load">Connecting to Supabase…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>var users=[];function el(x){return document.getElementById(x)}function esc(v){var d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML}function date(v){return v?new Date(v).toLocaleString():'—'}function initials(e){return (e||'?').split('@')[0].replace(/[^a-z0-9]/gi,'').slice(0,2).toUpperCase()||'?'}function avatar(u){var m=u.raw_user_meta_data||{};var src=m.avatar_url||m.picture||m.photo_url||m.profile_image||m.image;return src?'<div class="avatar"><img src="'+esc(src)+'" alt="Profile" onerror="this.parentElement.innerHTML=\''+initials(u.email)+'\'"/></div>':'<div class="avatar">'+initials(u.email)+'</div>'}function render(list){if(!list.length){el('grid').innerHTML='<div class="empty">No users match your search.</div>';return}el('grid').innerHTML=list.map(function(u){var id=String(u.id||'');var status=u.banned_until?'Banned':u.email_confirmed_at?'Active':'Unconfirmed';return '<article class="card"><div class="person">'+avatar(u)+'<div><div class="name">'+esc(u.email||'Unnamed user')+'</div><div class="uid">'+esc(id)+'</div></div></div><div class="details"><div class="line"><span class="label">STATUS</span><span class="val"><span class="badge">'+status+'</span></span></div><div class="line"><span class="label">PHONE</span><span class="val">'+esc(u.phone||'Not provided')+'</span></div><div class="line"><span class="label">CREATED</span><span class="val">'+date(u.created_at)+'</span></div><div class="line"><span class="label">LAST SIGN IN</span><span class="val">'+date(u.last_sign_in_at)+'</span></div></div><div class="foot"><span class="muted">Auth account</span><a class="view" href="user-details.html?id='+encodeURIComponent(id)+'">View full profile →</a></div></article>'}).join('')}async function loadUsers(){el('meta').textContent='Loading Auth users…';var r=await db.rpc('admin_list_auth_users');if(r.error){el('meta').textContent='Unable to load users';el('grid').innerHTML='<div class="empty">Unable to load Auth users.</div>';el('err').innerHTML='<div class="error">'+esc(r.error.message)+'</div>';return}users=Array.isArray(r.data)?r.data:[];el('meta').textContent=users.length+' authenticated user'+(users.length===1?'':'s')+' found';el('err').innerHTML='';render(users)}async function start(){var s=await requireAdmin();if(!s)return;el('email').textContent=s.user.email||'Administrator';el('logout').onclick=async function(){this.disabled=true;this.querySelector('span').textContent='Signing out…';await signOutAdmin()};el('q').oninput=function(){var q=this.value.toLowerCase().trim();render(users.filter(function(u){return !q||JSON.stringify(u).toLowerCase().includes(q)}))};await loadUsers();setInterval(loadUsers,30000)}start().catch(function(e){el('err').innerHTML='<div class="error">'+esc(e.message||e)+'</div>'});</script></body></html>
