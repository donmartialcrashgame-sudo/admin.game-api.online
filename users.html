<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex,nofollow,noarchive"><title>Game API — Users</title><link rel="icon" href="https://game-api.online/favicon.ico"><style>*{box-sizing:border-box}body{margin:0;background:#050811;color:#f8fafc;font-family:Inter,system-ui,Arial,sans-serif}.sidebar{position:fixed;inset:0 auto 0 0;width:245px;background:#0b101a;border-right:1px solid #ffffff10;padding:24px 15px;display:flex;flex-direction:column}.sidebar-brand{display:flex;align-items:center;gap:11px;padding:0 10px 28px}.brand-mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#4f8cff,#7c3aed);font-weight:900}.sidebar-brand strong,.sidebar-brand small{display:block}.sidebar-brand strong{font-size:13px}.sidebar-brand small{font-size:8px;color:#6f7c90;letter-spacing:.15em;margin-top:3px}.sidebar nav{display:grid;gap:5px}.nav-item,.logout{border:0;background:none;color:#8794a8;text-align:left;padding:12px 13px;border-radius:9px;cursor:pointer;display:flex;gap:12px;align-items:center;font-weight:650;text-decoration:none}.nav-item:hover,.nav-item.active{background:#172131;color:#fff}.logout{margin-top:auto;width:100%}.main{margin-left:245px;min-height:100vh;padding:34px 42px}.topbar{display:flex;align-items:end;justify-content:space-between;margin-bottom:28px}.eyebrow{font-size:10px;letter-spacing:.16em;color:#7f8ca1;font-weight:800}.topbar h2{margin:7px 0 0;font-size:29px}.admin-pill{border:1px solid #ffffff12;background:#0d141f;border-radius:99px;padding:9px 13px;color:#aab5c5;font-size:11px;display:flex;gap:8px;align-items:center}.status-dot{width:7px;height:7px;border-radius:50%;background:#20c997;box-shadow:0 0 12px #20c997}.panel{background:#0d141f;border:1px solid #ffffff0e;border-radius:15px;overflow:hidden}.panel-head{padding:20px;border-bottom:1px solid #ffffff0b;display:flex;justify-content:space-between;align-items:center}.panel-head h3{margin:0;font-size:15px}.meta{color:#637084;font-size:10px;margin-top:5px}.search{background:#050811;border:1px solid #ffffff12;border-radius:9px;padding:10px 12px;color:#fff;outline:none}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{text-align:left;padding:15px 20px;border-bottom:1px solid #ffffff08;font-size:11px}th{font-size:9px;color:#718096;letter-spacing:.08em}td{color:#b9c3d1}.badge{padding:5px 8px;border-radius:99px;background:#20c99716;color:#51ddb4;font-size:9px}.loading{text-align:center;padding:35px;color:#68758a;font-size:11px}@media(max-width:800px){.sidebar{width:68px;padding:18px 8px}.sidebar-brand div:not(.brand-mark),.nav-item span,.logout span{display:none}.main{margin-left:68px;padding:24px 18px}.topbar{align-items:start;gap:15px;flex-direction:column}}@media(max-width:480px){.panel-head{align-items:stretch;gap:12px;flex-direction:column}.search{width:100%}}</style></head><body><aside class="sidebar"><div class="sidebar-brand"><div class="brand-mark">G</div><div><strong>GAME API</strong><small>ADMIN</small></div></div><nav><a class="nav-item" href="dashboard.html">◈ <span>Overview</span></a><a class="nav-item active" href="users.html">♙ <span>Users</span></a><a class="nav-item" href="games.html">◉ <span>Games</span></a><a class="nav-item" href="api.html">⌁ <span>API & Keys</span></a><a class="nav-item" href="transactions.html">₦ <span>Transactions</span></a><a class="nav-item" href="logs.html">▤ <span>Activity Logs</span></a><a class="nav-item" href="settings.html">⚙ <span>Settings</span></a></nav><button id="logoutBtn" class="logout">↪ <span>Sign out</span></button></aside><main class="main"><header class="topbar"><div><span class="eyebrow">ADMIN CONSOLE</span><h2>Users</h2></div><div class="admin-pill"><span class="status-dot"></span><span id="adminEmail">Administrator</span></div></header><section class="panel"><div class="panel-head"><div><h3>All Auth Users</h3><div id="meta" class="meta">Loading users from Supabase Authentication…</div></div><input id="search" class="search" placeholder="Search email, ID or phone..."></div><div class="table-wrap"><table><thead><tr><th>USER ID</th><th>EMAIL</th><th>PHONE</th><th>STATUS</th><th>CREATED</th><th>LAST SIGN IN</th></tr></thead><tbody id="userRows"><tr><td colspan="6" class="loading">Loading users...</td></tr></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const c=window.GAME_API_CONFIG||{};let s=null,rows=[];const $=id=>document.getElementById(id);async function init(){if(!c.SUPABASE_URL||!c.SUPABASE_ANON_KEY)return location.replace('index.html');s=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);const{data}=await s.auth.getSession();if(!data.session)return location.replace('index.html');const{data:a,error:ae}=await s.from('admin_users').select('user_id').eq('user_id',data.session.user.id).eq('role','admin').maybeSingle();if(ae||!a){await s.auth.signOut();return location.replace('index.html')}$("adminEmail").textContent=data.session.user.email||'Administrator';$('logoutBtn').onclick=async()=>{await s.auth.signOut();location.replace('index.html')};await loadUsers()}async function loadUsers(){try{const{data,error}=await s.functions.invoke('admin-list-users');if(error)throw error;rows=data?.users||[];render(rows);$('meta').textContent=`${rows.length} authenticated user${rows.length===1?'':'s'} found`;}catch(e){$('userRows').innerHTML='<tr><td colspan="6" class="loading">Unable to load Auth users. Please try again.</td></tr>';$('meta').textContent='Could not load users'}}function render(list){if(!list.length){$('userRows').innerHTML='<tr><td colspan="6" class="loading">No Auth users found.</td></tr>';return}$('userRows').innerHTML=list.map(u=>{const status=u.banned_until?'Banned':(u.email_confirmed_at?'Active':'Unconfirmed');return `<tr><td title="${u.id}">${u.id.slice(0,12)}…</td><td>${esc(u.email||'—')}</td><td>${esc(u.phone||'—')}</td><td><span class="badge">${status}</span></td><td>${fmt(u.created_at)}</td><td>${fmt(u.last_sign_in_at)}</td></tr>`}).join('')}function fmt(v){return v?new Date(v).toLocaleString():'—'}function esc(v){return String(v).replace(/[&<>'"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]))}$('search').oninput=e=>{const q=e.target.value.toLowerCase();render(rows.filter(u=>(u.email||'').toLowerCase().includes(q)||u.id.toLowerCase().includes(q)||(u.phone||'').toLowerCase().includes(q)))}init();</script></body></html>
