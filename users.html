<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Game API — Users</title><style>body{margin:0;background:#050811;color:#f8fafc;font:14px Inter,system-ui,Arial}.side{position:fixed;width:235px;top:0;bottom:0;background:#0b101a;border-right:1px solid #ffffff10;padding:24px 15px}.brand{display:flex;gap:10px;align-items:center;margin:0 10px 25px}.mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#4f8cff,#7c3aed);font-weight:900}.brand small{display:block;color:#718096;font-size:8px;letter-spacing:.15em}.nav a,.logout{display:flex;gap:12px;color:#8794a8;text-decoration:none;padding:12px;border-radius:9px;margin:4px 0;background:none;border:0;width:100%;text-align:left;cursor:pointer}.nav a:hover,.nav .on{background:#172131;color:white}.logout{position:absolute;bottom:20px}.main{margin-left:235px;padding:34px 42px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}.ey{font-size:10px;letter-spacing:.16em;color:#7f8ca1}.top h1{margin:7px 0 0}.pill{background:#0d141f;border:1px solid #ffffff12;border-radius:20px;padding:9px 12px;color:#aab5c5;font-size:11px}.dot{display:inline-block;width:7px;height:7px;background:#20c997;border-radius:50%;margin-right:7px}.panel{background:#0d141f;border:1px solid #ffffff0e;border-radius:15px;overflow:hidden}.head{padding:20px;border-bottom:1px solid #ffffff0b;display:flex;justify-content:space-between;gap:15px;align-items:center}.head h3{margin:0}.search{background:#050811;border:1px solid #ffffff12;color:white;padding:10px;border-radius:9px}.wrap{overflow:auto}table{width:100%;min-width:800px;border-collapse:collapse}th,td{padding:14px 18px;border-bottom:1px solid #ffffff08;text-align:left;font-size:11px}th{font-size:9px;color:#718096}.badge{color:#54ddb3;background:#20c99716;border-radius:99px;padding:5px 8px}.load{text-align:center;color:#68758a;padding:35px}@media(max-width:700px){.side{width:55px;padding:18px 7px}.brand div:last-child,.nav span,.logout span{display:none}.main{margin-left:55px;padding:20px 14px}.top{display:block}.pill{display:inline-block;margin-top:15px}}</style></head><body><aside class="side"><div class="brand"><div class="mark">G</div><div><b>GAME API</b><small>ADMIN</small></div></div><nav class="nav"><a href="dashboard.html">◈ <span>Overview</span></a><a class="on" href="users.html">♙ <span>Users</span></a><a href="games.html">◉ <span>Games</span></a><a href="api.html">⌁ <span>API & Keys</span></a><a href="transactions.html">₦ <span>Transactions</span></a><a href="logs.html">▤ <span>Activity Logs</span></a><a href="notification.html">◫ <span>Notifications</span></a><a href="settings.html">⚙ <span>Settings</span></a></nav><button class="logout" id="logout">↪ <span>Sign out</span></button></aside><main class="main"><div class="top"><div><div class="ey">ADMIN CONSOLE</div><h1>Users</h1></div><div class="pill"><i class="dot"></i><span id="email">Administrator</span></div></div><section class="panel"><div class="head"><div><h3>All Auth Users</h3><small id="meta">Loading…</small></div><input id="q" class="search" placeholder="Search email, ID or phone"></div><div class="wrap"><table><thead><tr><th>USER ID</th><th>EMAIL</th><th>PHONE</th><th>STATUS</th><th>CREATED</th><th>LAST SIGN IN</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="load">Loading users…</td></tr></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const cfg=window.GAME_API_CONFIG||{};let client,users=[];const el=id=>document.getElementById(id);async function init(){if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){location.href='index.html';return}client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const sessionResult=await client.auth.getSession();const session=sessionResult.data.session;if(!session){location.href='index.html';return}const adminResult=await client.from('admin_users').select('user_id').eq('user_id',session.user.id).eq('role','admin').maybeSingle();if(adminResult.error||!adminResult.data){await client.auth.signOut();location.href='index.html';return}el('email').textContent=session.user.email||'Administrator';el('logout').onclick=async()=>{await client.auth.signOut();location.href='index.html'};await loadUsers();setInterval(loadUsers,15000)}async function loadUsers(){try{const result=await client.functions.invoke('admin-list-users');if(result.error)throw result.error;users=result.data&&Array.isArray(result.data.users)?result.data.users:[];render(users);el('meta').textContent=users.length+' authenticated user'+(users.length===1?'':'s')}catch(err){el('rows').innerHTML='<tr><td colspan="6" class="load">Unable to load Auth users. Check the admin-list-users Edge Function.</td></tr>'}}function render(list){if(!list.length){el('rows').innerHTML='<tr><td colspan="6" class="load">No Auth users found.</td></tr>';return}el('rows').innerHTML=list.map(u=>{const status=u.banned_until?'Banned':u.email_confirmed_at?'Active':'Unconfirmed';return '<tr><td>'+esc(u.id)+'</td><td>'+esc(u.email||'—')+'</td><td>'+esc(u.phone||'—')+'</td><td><span class="badge">'+status+'</span></td><td>'+date(u.created_at)+'</td><td>'+date(u.last_sign_in_at)+'</td></tr>'}).join('')}function date(v){return v?new Date(v).toLocaleString():'—'}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}el('q').oninput=e=>{const q=e.target.value.toLowerCase();render(users.filter(u=>(u.email||'').toLowerCase().includes(q)||(u.id||'').toLowerCase().includes(q)||(u.phone||'').toLowerCase().includes(q)))}init();</script></body></html>
