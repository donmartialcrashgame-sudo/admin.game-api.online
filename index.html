<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Game API — Admin</title>
  <link rel="icon" href="https://game-api.online/favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <section id="loginScreen" class="login-screen">
      <div class="login-card">
        <div class="brand-mark">G</div>
        <span class="eyebrow">GAME API</span>
        <h1>Admin Portal</h1>
        <p>Authorized administrators only.</p>
        <form id="loginForm">
          <label>Email</label>
          <input id="email" type="email" autocomplete="username" required placeholder="admin@example.com">
          <label>Password</label>
          <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
          <button type="submit">Sign in</button>
          <div id="loginError" class="error" hidden></div>
        </form>
        <small>Your access is protected by Supabase authentication and database policies.</small>
      </div>
    </section>

    <section id="dashboard" hidden>
      <aside class="sidebar">
        <div class="sidebar-brand"><div class="brand-mark">G</div><div><strong>GAME API</strong><small>ADMIN</small></div></div>
        <nav>
          <button class="nav-item active" data-page="overview">◈ <span>Overview</span></button>
          <button class="nav-item" data-page="users">♙ <span>Users</span></button>
          <button class="nav-item" data-page="games">◉ <span>Games</span></button>
          <button class="nav-item" data-page="api">⌁ <span>API & Keys</span></button>
          <button class="nav-item" data-page="transactions">₦ <span>Transactions</span></button>
          <button class="nav-item" data-page="logs">▤ <span>Activity Logs</span></button>
          <button class="nav-item" data-page="settings">⚙ <span>Settings</span></button>
        </nav>
        <button id="logoutBtn" class="logout">↪ <span>Sign out</span></button>
      </aside>

      <main class="main">
        <header class="topbar"><div><span class="eyebrow">ADMIN CONSOLE</span><h2 id="pageTitle">Overview</h2></div><div class="admin-pill"><span class="status-dot"></span><span id="adminEmail">Administrator</span></div></header>
        <div id="pageContent"></div>
      </main>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
