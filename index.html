<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#050811"><title>Game API — Admin Access</title><link rel="icon" href="https://game-api.online/favicon.ico"><style>body{margin:0;min-height:100vh;background:#050811;color:#f8fafc;font-family:Inter,system-ui,Arial,sans-serif;display:grid;place-items:center}.box{width:min(430px,calc(100% - 36px));padding:38px;background:#0d141f;border:1px solid #ffffff12;border-radius:20px;box-shadow:0 25px 70px #0008}.mark{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#4f8cff,#7c3aed);font-weight:900}.ey{font-size:10px;letter-spacing:.16em;color:#8290a5;font-weight:800;margin-top:28px}.box h1{margin:8px 0;font-size:30px}.sub{color:#8492a7;font-size:12px;line-height:1.6;margin-bottom:25px}label{display:block;font-size:11px;font-weight:700;margin:15px 0 7px}.input{width:100%;padding:13px;border:1px solid #ffffff14;border-radius:10px;background:#ffffff07;color:#fff;outline:none;box-sizing:border-box}.input:focus{border-color:#4f8cff88}.btn{width:100%;margin-top:20px;border:0;border-radius:10px;padding:14px;background:linear-gradient(135deg,#4f8cff,#2563eb);color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6}.error{margin-top:13px;padding:11px;border-radius:9px;background:#ff647814;color:#ff9daa;font-size:10px}.status{margin-top:20px;color:#68758a;font-size:9px}</style></head><body><main class="box"><div class="mark">G</div><div class="ey">PRIVATE ADMINISTRATION</div><h1>Welcome back</h1><p class="sub">Sign in to continue to your Game API administrator dashboard.</p><form id="loginForm"><label for="email">Email address</label><input class="input" id="email" type="email" autocomplete="username" required placeholder="admin@example.com"><label for="password">Password</label><input class="input" id="password" type="password" autocomplete="current-password" required placeholder="Enter your password"><button class="btn" id="submit" type="submit">Sign in to Admin →</button><div id="loginError" class="error" hidden></div></form><div class="status">🔒 Supabase Authentication • Authorized administrators only</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const cfg=window.GAME_API_CONFIG||{};let client;const $=id=>document.getElementById(id);function error(m){$('loginError').textContent=m;$('loginError').hidden=false}async function init(){if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY)return error('Supabase authentication is not configured.');try{client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{storageKey:'game-api-admin-auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const r=await client.auth.getSession();if(r.error)throw r.error;if(r.data.session)await verify(r.data.session.user)}catch(e){console.error(e);error('Unable to initialize secure sign in. Please refresh the page.')}}async function verify(user){const r=await client.from('admin_users').select('user_id,role').eq('user_id',user.id).eq('role','admin').maybeSingle();if(r.error)throw r.error;if(!r.data){await client.auth.signOut();return error('This account is not authorized for the administrator portal.')}location.replace('dashboard.html')}$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').hidden=true;const b=$('submit');b.disabled=true;b.textContent='Signing in…';try{if(!client)throw Error('Authentication is not ready.');const email=$('email').value.trim(),password=$('password').value;if(!email||!password)throw Error('Enter your email and password.');const r=await client.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(!r.data.session)throw Error('No session was created.');await verify(r.data.user)}catch(err){console.error('Admin sign in:',err);error(err.message==='Invalid login credentials'?'Sign in failed. Check your email and password.':'Sign in failed. Please try again.')}finally{b.disabled=false;b.textContent='Sign in to Admin →'}});init();</script></body></html>
