<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Game API — User Details</title><style>body{margin:0;background:#050811;color:#f8fafc;font:14px Inter,system-ui,Arial}.side{position:fixed;width:235px;top:0;bottom:0;background:#0b101a;border-right:1px solid #ffffff10;padding:24px 15px}.brand{display:flex;gap:10px;align-items:center;margin:0 10px 25px}.mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#4f8cff,#7c3aed);font-weight:900}.brand small{display:block;color:#718096;font-size:8px;letter-spacing:.15em}.nav a,.logout{display:flex;gap:12px;color:#8794a8;text-decoration:none;padding:12px;border-radius:9px;margin:4px 0;background:none;border:0;width:100%;text-align:left;cursor:pointer}.nav a:hover,.nav .on{background:#172131;color:#fff}.logout{position:absolute;bottom:20px}.main{margin-left:235px;padding:34px 42px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}.ey{font-size:10px;letter-spacing:.16em;color:#7f8ca1}.top h1{margin:7px 0 0}.pill{background:#0d141f;border:1px solid #ffffff12;border-radius:20px;padding:9px 12px;color:#aab5c5;font-size:11px}.dot{display:inline-block;width:7px;height:7px;background:#20c997;border-radius:50%;margin-right:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#0d141f;border:1px solid #ffffff0e;border-radius:15px;padding:22px}.panel h3{margin-top:0}.row{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid #ffffff08}.label{color:#718096;font-size:10px}.value{font-size:11px;text-align:right;word-break:break-all}.actions{display:grid;gap:10px}.action{border:1px solid #ffffff12;background:#111a28;color:#fff;padding:12px;border-radius:9px;text-align:left;cursor:pointer}.danger{border-color:#ff647844;background:#ff64780b;color:#ff9daa}.result{margin-top:15px;padding:11px;border-radius:9px;font-size:11px;background:#20c99714;color:#54ddb3}.error{background:#ff647814;color:#ff9daa}.back{display:inline-block;color:#76a4ff;text-decoration:none;margin-bottom:15px;font-size:11px}.muted{color:#68758a;font-size:11px}@media(max-width:700px){.side{width:55px;padding:18px 7px}.brand div:last-child,.nav span,.logout span{display:none}.main{margin-left:55px;padding:20px 14px}.grid{grid-template-columns:1fr}.top{display:block}.pill{display:inline-block;margin-top:15px}}</style></head><body><aside class="side"><div class="brand"><div class="mark">G</div><div><b>GAME API</b><small>ADMIN</small></div></div><nav class="nav"><a href="dashboard.html">◈ <span>Overview</span></a><a class="on" href="users.html">♙ <span>Users</span></a><a href="games.html">◉ <span>Games</span></a><a href="api.html">⌁ <span>API & Keys</span></a><a href="transactions.html">₦ <span>Transactions</span></a><a href="logs.html">▤ <span>Activity Logs</span></a><a href="notification.html">◫ <span>Notifications</span></a><a href="settings.html">⚙ <span>Settings</span></a></nav><button class="logout" id="logout">↪ <span>Sign out</span></button></aside><main class="main"><a class="back" href="users.html">← Back to users</a><div class="top"><div><div class="ey">USER MANAGEMENT</div><h1 id="title">User Details</h1></div><div class="pill"><i class="dot"></i><span id="admin">Administrator</span></div></div><div class="grid"><section class="panel"><h3>Account</h3><div id="details"><p class="muted">Loading user…</p></div></section><section class="panel"><h3>Admin Actions</h3><div class="actions"><button class="action" data-action="confirm_email">Confirm email</button><button class="action" data-action="ban">Ban user</button><button class="action" data-action="unban">Unban user</button><button class="action danger" data-action="delete">Delete user</button></div><div id="result" hidden></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
(function(){
var cfg=window.GAME_API_CONFIG||{};var client=null;var targetId=new URLSearchParams(location.search).get('id');var $=function(id){return document.getElementById(id)};
function esc(v){var d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML}function date(v){return v?new Date(v).toLocaleString():'—'}
function show(message,error){var r=$('result');r.textContent=message;r.className=error?'result error':'result';r.hidden=false}
async function init(){if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY||!targetId){location.href='users.html';return}client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);var sr=await client.auth.getSession();if(!sr.data.session){location.href='index.html';return}var ar=await client.from('admin_users').select('user_id').eq('user_id',sr.data.session.user.id).eq('role','admin').maybeSingle();if(ar.error||!ar.data){await client.auth.signOut();location.href='index.html';return}$('admin').textContent=sr.data.session.user.email||'Administrator';$('logout').onclick=async function(){await client.auth.signOut();location.href='index.html'};await loadUser()}
async function loadUser(){try{var r=await client.functions.invoke('admin-list-users');if(r.error)throw r.error;var list=r.data&&r.data.users||[];var u=list.find(function(x){return x.id===targetId});if(!u){$('details').innerHTML='<p class="muted">User not found.</p>';return}$('title').textContent=u.email||'User Details';$('details').innerHTML='<div class="row"><span class="label">USER ID</span><span class="value">'+esc(u.id)+'</span></div><div class="row"><span class="label">EMAIL</span><span class="value">'+esc(u.email||'—')+'</span></div><div class="row"><span class="label">PHONE</span><span class="value">'+esc(u.phone||'—')+'</span></div><div class="row"><span class="label">STATUS</span><span class="value">'+(u.banned_until?'Banned':u.email_confirmed_at?'Active':'Unconfirmed')+'</span></div><div class="row"><span class="label">CREATED</span><span class="value">'+date(u.created_at)+'</span></div><div class="row"><span class="label">LAST SIGN IN</span><span class="value">'+date(u.last_sign_in_at)+'</span></div>'}catch(e){show('Unable to load user details.',true)}}
document.querySelectorAll('.action').forEach(function(btn){btn.onclick=async function(){var action=btn.dataset.action;if(action==='delete'&&!confirm('Delete this Auth user permanently?'))return;btn.disabled=true;try{var r=await client.functions.invoke('admin-user-actions',{body:{user_id:targetId,action:action}});if(r.error)throw r.error;show(action==='delete'?'User deleted successfully.':('Action completed: '+action));if(action==='delete')setTimeout(function(){location.href='users.html'},900);else await loadUser()}catch(e){show('Action failed. '+(e.message||''),true)}finally{btn.disabled=false}}});
init();
})();
</script></body></html>
