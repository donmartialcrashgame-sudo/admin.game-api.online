<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Game API — Notifications</title><style>*{box-sizing:border-box}body{margin:0;background:#050811;color:#f8fafc;font:14px Inter,system-ui,Arial}.side{position:fixed;inset:0 auto 0 0;width:245px;background:#0b101a;border-right:1px solid #ffffff10;padding:24px 15px}.brand{display:flex;gap:10px;align-items:center;margin:0 10px 25px}.mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#4f8cff,#7c3aed);font-weight:900}.brand small{display:block;color:#718096;font-size:8px}.nav a,.logout{display:flex;gap:12px;color:#8794a8;text-decoration:none;padding:12px;border-radius:9px;margin:4px 0;background:none;border:0;width:100%;text-align:left;cursor:pointer}.nav a:hover,.nav .on{background:#172131;color:#fff}.logout{position:absolute;bottom:20px}.main{margin-left:245px;padding:34px 42px}.top{display:flex;justify-content:space-between;margin-bottom:25px}.ey{font-size:10px;letter-spacing:.16em;color:#7f8ca1}.top h1{margin:7px 0}.pill{background:#0d141f;border:1px solid #ffffff12;border-radius:20px;padding:9px 12px;font-size:11px}.dot{display:inline-block;width:7px;height:7px;background:#20c997;border-radius:50%;margin-right:7px}.panel{max-width:800px;background:#0d141f;border:1px solid #ffffff0e;border-radius:15px;padding:24px}.field{margin-bottom:17px}.field label{display:block;font-size:10px;color:#9aa7b9;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;background:#050811;border:1px solid #ffffff12;border-radius:9px;color:#fff;padding:12px;outline:none}.field textarea{min-height:130px;resize:vertical}.send{border:0;border-radius:9px;padding:13px 18px;background:linear-gradient(135deg,#4f8cff,#2563eb);color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:14px;padding:11px;border-radius:9px;font-size:11px;background:#20c99714;color:#54ddb3}.err{background:#ff647814;color:#ff9daa}@media(max-width:700px){.side{width:68px;padding:18px 8px}.brand div:last-child,.nav span,.logout span{display:none}.main{margin-left:68px;padding:22px 15px}}</style></head><body><aside class="side"><div class="brand"><div class="mark">G</div><div><b>GAME API</b><small>ADMIN</small></div></div><nav class="nav"><a href="dashboard.html">◈ <span>Overview</span></a><a href="users.html">♙ <span>Users</span></a><a href="games.html">◉ <span>Games</span></a><a href="api.html">⌁ <span>API & Keys</span></a><a href="transactions.html">₦ <span>Transactions</span></a><a href="logs.html">▤ <span>Activity Logs</span></a><a class="on" href="notification.html">◫ <span>Notifications</span></a><a href="settings.html">⚙ <span>Settings</span></a></nav><button class="logout" id="logout">↪ <span>Sign out</span></button></aside><main class="main"><div class="top"><div><div class="ey">ADMIN CONSOLE</div><h1>Send Notification</h1></div><div class="pill"><i class="dot"></i><span id="email">Administrator</span></div></div><section class="panel"><div class="field"><label>NOTIFICATION TITLE</label><input id="title" maxlength="120" placeholder="Enter notification title"></div><div class="field"><label>MESSAGE</label><textarea id="message" maxlength="1000" placeholder="Write your message..."></textarea></div><div class="field"><label>RECIPIENT</label><select id="recipient"><option value="all">All users</option><option value="specific">Specific user</option></select></div><div id="userField" class="field" hidden><label>USER ID</label><input id="userId" placeholder="Supabase Auth user ID"></div><button id="send" class="send">Send Notification</button><div id="result" hidden></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>let client;async function init(){const c=window.GAME_API_CONFIG||{};if(!c.SUPABASE_URL||!c.SUPABASE_ANON_KEY)return location.href='index.html';client=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);const r=await client.auth.getSession();if(!r.data.session)return location.href='index.html';const a=await client.from('admin_users').select('user_id').eq('user_id',r.data.session.user.id).eq('role','admin').maybeSingle();if(a.error||!a.data){await client.auth.signOut();return location.href='index.html'}document.getElementById('email').textContent=r.data.session.user.email||'Administrator';document.getElementById('logout').onclick=async()=>{await client.auth.signOut();location.href='index.html'}}document.getElementById('recipient').onchange=e=>document.getElementById('userField').hidden=e.target.value!=='specific';document.getElementById('send').onclick=async()=>{const title=document.getElementById('title').value.trim(),message=document.getElementById('message').value.trim(),recipient=document.getElementById('recipient').value,userId=document.getElementById('userId').value.trim(),box=document.getElementById('result');box.hidden=true;if(!title||!message)return show('Enter a title and message.','err');if(recipient==='specific'&&!userId)return show('Enter a recipient user ID.','err');try{const r=await client.functions.invoke('admin-send-notification',{body:{title,message,recipient,user_id:userId||null}});if(r.error)throw r.error;show('Notification sent successfully.','ok');document.getElementById('title').value='';document.getElementById('message').value=''}catch(e){show('Notification could not be sent. Create/configure the admin-send-notification Edge Function first.','err')}};function show(t,c){const b=document.getElementById('result');b.textContent=t;b.className='msg '+c;b.hidden=false}init();</script></body></html>
